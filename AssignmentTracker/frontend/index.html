<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Assignment Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>redirectIfLoggedIn();</script>
</head>
<body class="centered">
  <main class="card">
    <h1>Assignment Tracker</h1>
    <p class="subtitle">Log in to see your assignments</p>

    <form id="login-form">
      <label>Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <p id="message" class="message" hidden role="alert"></p>
      <button type="submit" class="btn primary full">Log in</button>
    </form>

    <p class="switch">No account? <a href="signup.html">Sign up</a></p>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // stop the browser's default full-page form submit
      showMessage(message, "");
      button.disabled = true;
      button.textContent = "Logging in…";

      try {
        await login(form.email.value.trim(), form.password.value);
        location.replace(HOME_PAGE);
      } catch (err) {
        showMessage(message, err.message);
        button.disabled = false;
        button.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
